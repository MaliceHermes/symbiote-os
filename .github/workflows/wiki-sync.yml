name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-wiki:
    name: Validate wiki/ documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Validate wiki markdown files
        run: |
          echo "=== Checking wiki/ directory ==="
          find wiki -type f -name "*.md" | sort

          echo ""
          echo "=== Validating markdown files ==="

          # Check each markdown file for basic structure
          for f in $(find wiki -type f -name "*.md"); do
            echo "Checking: $f"

            # Check for at least one heading
            if ! grep -q "^#" "$f"; then
              echo "  ERROR: No heading found in $f"
              exit 1
            fi

            # Check for reasonable file size (not empty, not huge)
            filesize=$(wc -c < "$f")
            echo "  Size: ${filesize} bytes"

            if [ "$filesize" -lt 10 ]; then
              echo "  WARNING: File appears empty"
            fi
          done

          echo ""
          echo "=== Wiki validation complete ==="
          echo "Total markdown files: $(find wiki -type f -name "*.md" | wc -l)"
