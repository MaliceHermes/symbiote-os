name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend: Vite + React + Tailwind ───────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          CI: true

  # ─── Orchestrator: Node.js backend ──────────────────────────
  orchestrator:
    name: Orchestrator Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test 2>&1 || echo "No test script yet"

  # ─── Install script validation ──────────────────────────────
  install-check:
    name: Install Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint install.sh
        run: shellcheck install.sh
      - name: Lint start.sh
        run: shellcheck start.sh
      - name: Lint stop.sh
        run: shellcheck stop.sh

  # ─── Toxin: Android APK build ────────────────────────────────
  toxin:
    name: Toxin APK Build
    runs-on: macos-latest  # macOS required for Android SDK emulator tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK (if Gradle wrapper exists)
        working-directory: toxin
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -x lint
          else
            echo "Gradle wrapper not found — skipping Toxin build check"
            echo "This is expected in early scaffolding phase"
          fi
        continue-on-error: true

  # ─── Sync to MEGA (conditional) ─────────────────────────────
  mega-sync:
    name: Wiki Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wiki/ exists
        run: |
          if [ -d wiki ]; then
            echo "✅ wiki/ directory present"
            ls wiki/
          else
            echo "⚠️ wiki/ directory missing"
            exit 1
          fi
      - name: Validate wiki docs
        run: |
          # Simple markdown linting
          for f in $(find wiki -name "*.md"); do
            echo "Checking $f"
            if ! grep -q "# " "$f"; then
              echo "Warning: $f has no top-level heading"
            fi
          done
